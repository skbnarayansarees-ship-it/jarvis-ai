<script>


// ============================================================
// STATE
// ============================================================

let selectedLanguage = null;

let recognition = null;

let recognitionMode = "idle";

let isListening = false;

let ttsSpeaking = false;

let currentAudio = null;

let currentAudioUrl = null;

let ttsAbortController = null;

let ttsGeneration = 0;

let musicWindow = null;

let bargeStartTime = 0;


// ============================================================
// ELEMENTS
// ============================================================

const languageScreen =
    document.getElementById(
        "languageScreen"
    );


const chatScreen =
    document.getElementById(
        "chatScreen"
    );


const chatBox =
    document.getElementById(
        "chatBox"
    );


const userInput =
    document.getElementById(
        "userInput"
    );


const orb =
    document.getElementById(
        "orb"
    );


const languageStatus =
    document.getElementById(
        "languageStatus"
    );


const istClock =
    document.getElementById(
        "istClock"
    );


const youtubeArea =
    document.getElementById(
        "youtubeArea"
    );


const youtubePlayer =
    document.getElementById(
        "youtubePlayer"
    );


// ============================================================
// IST CLOCK
// ============================================================

const IST_OFFSET =
    19800000;


function getISTParts() {

    const date =
        new Date(
            Date.now() +
            IST_OFFSET
        );


    return {

        year:
            date.getUTCFullYear(),

        month:
            date.getUTCMonth() + 1,

        date:
            date.getUTCDate(),

        hour:
            date.getUTCHours(),

        minute:
            date.getUTCMinutes(),

        second:
            date.getUTCSeconds(),

        day:
            date.getUTCDay()
    };
}


function pad(value) {

    return String(value)
        .padStart(
            2,
            "0"
        );
}


function hour12(value) {

    const h =
        value % 12;


    return h === 0
        ? 12
        : h;
}


function ampm(value) {

    return value < 12
        ? "AM"
        : "PM";
}


function updateClock() {

    const t =
        getISTParts();


    istClock.textContent =
        `IST ${pad(hour12(t.hour))}:${pad(t.minute)}:${pad(t.second)} ${ampm(t.hour)}`;
}


updateClock();


setInterval(
    updateClock,
    1000
);


// ============================================================
// LANGUAGE
// ============================================================

function selectLanguage(
    language
) {

    selectedLanguage =
        language;


    languageScreen.style.display =
        "none";


    chatScreen.style.display =
        "flex";


    languageStatus.textContent =
        language === "hinglish"
            ? "Hinglish selected"
            : "English selected";


    if (
        language === "hinglish"
    ) {

        addMessage(
            "jarvis",
            "Haan bilkul. Main naturally Hinglish mein baat karunga. Batao kya poochna hai."
        );

    } else {

        addMessage(
            "jarvis",
            "Hello. I'm JARVIS. How can I help you?"
        );
    }


    initializeRecognition();


    userInput.focus();
}


// ============================================================
// MESSAGE
// ============================================================

function addMessage(
    type,
    text
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        `message-row ${type}`;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        `message ${type}`;


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    chatBox.appendChild(
        row
    );


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


function addThinking() {

    addMessage(
        "jarvis",

        selectedLanguage === "hinglish"
            ? "Soch raha hoon..."
            : "Thinking..."
    );


    const messages =
        document.querySelectorAll(
            ".message.jarvis"
        );


    if (
        messages.length
    ) {

        messages[
            messages.length - 1
        ].classList.add(
            "thinking"
        );
    }
}


function removeThinking() {

    const messages =
        document.querySelectorAll(
            ".message.jarvis"
        );


    if (
        !messages.length
    ) {

        return;
    }


    const last =
        messages[
            messages.length - 1
        ];


    if (
        last.textContent ===
            "Thinking..."
        ||
        last.textContent ===
            "Soch raha hoon..."
    ) {

        last.parentElement.remove();
    }
}


// ============================================================
// TIME / DATE DETECTION
// ============================================================

function isTimeQuestion(
    text
) {

    const t =
        text
            .toLowerCase()
            .trim();


    const phrases = [

        "what time is it",
        "what's the time",
        "whats the time",
        "current time",
        "current ist time",
        "ist time",
        "india time",
        "indian time",
        "kolkata time",
        "time in kolkata",
        "time in india",
        "tell me the time",

        "abhi kya time hai",
        "abhi kitne baje hain",
        "abhi kitne baje hai",
        "abhi time kya hai",
        "abhi ka time kya hai",
        "time kya hai",
        "time batao",
        "time bata",
        "kitne baje hain",
        "kitne baje hai",
        "india mein kya time hai",
        "india me kya time hai",
        "kolkata mein kya time hai",
        "kolkata me kya time hai"
    ];


    return phrases.some(
        phrase =>
            t.includes(
                phrase
            )
    );
}


function isDateQuestion(
    text
) {

    const t =
        text
            .toLowerCase()
            .trim();


    const phrases = [

        "what date is it",
        "what is today's date",
        "what's today's date",
        "today's date",
        "todays date",
        "current date",
        "today date",
        "date today",
        "what day is today",
        "which day is today",

        "aaj ki date kya hai",
        "aaj ki tarikh kya hai",
        "aaj kya date hai",
        "aaj ka din kya hai",
        "aaj ka day kya hai",
        "aaj konsa din hai",
        "aaj kaun sa din hai",
        "aaj ka date kya hai"
    ];


    return phrases.some(
        phrase =>
            t.includes(
                phrase
            )
    );
}


function getTimeAnswer() {

    const t =
        getISTParts();


    const exact =
        `${hour12(t.hour)}:${pad(t.minute)}:${pad(t.second)} ${ampm(t.hour)}`;


    if (
        selectedLanguage === "hinglish"
    ) {

        let part;


        if (
            t.hour >= 4 &&
            t.hour < 12
        ) {

            part = "subah";

        } else if (
            t.hour >= 12 &&
            t.hour < 17
        ) {

            part = "dopahar";

        } else if (
            t.hour >= 17 &&
            t.hour < 21
        ) {

            part = "shaam";

        } else {

            part = "raat";
        }


        return (
            `Abhi Kolkata aur poore India mein IST ke hisaab se ${exact} ho rahe hain, yani ${part} ka time hai.`
        );
    }


    return (
        `The current time in Kolkata, India is ${exact} IST.`
    );
}


function getDateAnswer() {

    const t =
        getISTParts();


    const days = [

        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];


    const months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];


    if (
        selectedLanguage === "hinglish"
    ) {

        return (
            `Aaj ${days[t.day]} hai aur IST ke hisaab se date ${t.date} ${months[t.month - 1]} ${t.year} hai.`
        );
    }


    return (
        `Today is ${days[t.day]}, ${t.date} ${months[t.month - 1]} ${t.year} in India.`
    );
}


// ============================================================
// TEXT CLEANING FOR TTS
// ============================================================

function cleanForSpeech(
    text
) {

    let result =
        String(
            text || ""
        );


    result =
        result.replace(
            /```[\s\S]*?```/g,
            " "
        );


    result =
        result.replace(
            /\[([^\]]+)\]\([^)]+\)/g,
            "$1"
        );


    result =
        result.replace(
            /[*_#>`~|]/g,
            " "
        );


    result =
        result.replace(
            /["“”‘’]/g,
            " "
        );


    result =
        result.replace(
            /[\[\]\{\}]/g,
            " "
        );


    try {

        result =
            result.replace(
                /\p{Extended_Pictographic}/gu,
                " "
            );

    } catch (error) {
    }


    return result
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


// ============================================================
// STOP TTS
// ============================================================

function stopTTS() {

    ttsGeneration++;


    ttsSpeaking =
        false;


    if (
        ttsAbortController
    ) {

        try {

            ttsAbortController.abort();

        } catch (e) {
        }


        ttsAbortController =
            null;
    }


    if (
        currentAudio
    ) {

        try {

            currentAudio.pause();

            currentAudio.currentTime =
                0;

            currentAudio.src =
                "";

        } catch (e) {
        }


        currentAudio =
            null;
    }


    if (
        currentAudioUrl
    ) {

        try {

            URL.revokeObjectURL(
                currentAudioUrl
            );

        } catch (e) {
        }


        currentAudioUrl =
            null;
    }


    if (
        "speechSynthesis"
        in window
    ) {

        try {

            window.speechSynthesis.cancel();

        } catch (e) {
        }
    }


    orb.classList.remove(
        "speaking"
    );
}


// ============================================================
// IMMEDIATE INTERRUPTION
// ============================================================

function interruptJarvis() {

    ttsGeneration++;


    ttsSpeaking =
        false;


    if (
        ttsAbortController
    ) {

        try {

            ttsAbortController.abort();

        } catch (e) {
        }


        ttsAbortController =
            null;
    }


    if (
        currentAudio
    ) {

        try {

            currentAudio.pause();

            currentAudio.currentTime =
                0;

            currentAudio.src =
                "";

        } catch (e) {
        }


        currentAudio =
            null;
    }


    if (
        currentAudioUrl
    ) {

        try {

            URL.revokeObjectURL(
                currentAudioUrl
            );

        } catch (e) {
        }


        currentAudioUrl =
            null;
    }


    if (
        "speechSynthesis"
        in window
    ) {

        try {

            window.speechSynthesis.cancel();

        } catch (e) {
        }
    }


    orb.classList.remove(
        "speaking"
    );
}


// ============================================================
// TTS
// ============================================================

async function speakText(
    text
) {

    stopTTS();


    const cleanText =
        cleanForSpeech(
            text
        );


    if (
        !cleanText
    ) {

        return;
    }


    ttsSpeaking =
        true;


    orb.classList.add(
        "speaking"
    );


    const generation =
        ttsGeneration;


    try {

        ttsAbortController =
            new AbortController();


        const response =
            await fetch(
                "/speak",
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify({

                            text:
                                cleanText,

                            language:
                                selectedLanguage
                        }),

                    signal:
                        ttsAbortController
                            .signal
                }
            );


        if (
            generation !==
            ttsGeneration
        ) {

            return;
        }


        if (
            !response.ok
        ) {

            throw new Error(
                "Voice server failed"
            );
        }


        const blob =
            await response.blob();


        if (
            generation !==
            ttsGeneration
        ) {

            return;
        }


        currentAudioUrl =
            URL.createObjectURL(
                blob
            );


        currentAudio =
            new Audio(
                currentAudioUrl
            );


        currentAudio.preload =
            "auto";


        currentAudio.volume =
            1;


        currentAudio.onplay =
            function() {

                if (
                    generation !==
                    ttsGeneration
                ) {

                    return;
                }


                ttsSpeaking =
                    true;


                orb.classList.add(
                    "speaking"
                );


                /*
                    Start interruption listening
                    shortly after JARVIS begins.
                */

                setTimeout(
                    function() {

                        if (
                            ttsSpeaking
                            &&
                            generation ===
                                ttsGeneration
                        ) {

                            startBargeListening();
                        }

                    },
                    800
                );
            };


        currentAudio.onended =
            function() {

                ttsSpeaking =
                    false;


                orb.classList.remove(
                    "speaking"
                );


                if (
                    recognitionMode ===
                    "barge"
                ) {

                    recognitionMode =
                        "idle";


                    try {

                        recognition.stop();

                    } catch (e) {
                    }
                }


                if (
                    currentAudioUrl
                ) {

                    try {

                        URL.revokeObjectURL(
                            currentAudioUrl
                        );

                    } catch (e) {
                    }


                    currentAudioUrl =
                        null;
                }


                currentAudio =
                    null;
            };


        currentAudio.onerror =
            function() {

                ttsSpeaking =
                    false;


                orb.classList.remove(
                    "speaking"
                );
            };


        await currentAudio.play();


    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            return;
        }


        console.error(
            "TTS error:",
            error
        );


        ttsSpeaking =
            false;


        orb.classList.remove(
            "speaking"
        );


        /*
            Browser voice fallback
        */

        if (
            "speechSynthesis"
            in window
        ) {

            try {

                const speech =
                    new SpeechSynthesisUtterance(
                        cleanText
                    );


                speech.lang =
                    "en-IN";


                speech.rate =
                    selectedLanguage ===
                    "hinglish"
                        ? 0.9
                        : 0.95;


                speech.onstart =
                    function() {

                        ttsSpeaking =
                            true;


                        orb.classList.add(
                            "speaking"
                        );


                        setTimeout(
                            function() {

                                if (
                                    ttsSpeaking
                                ) {

                                    startBargeListening();
                                }

                            },
                            800
                        );
                    };


                speech.onend =
                    function() {

                        ttsSpeaking =
                            false;


                        orb.classList.remove(
                            "speaking"
                        );
                    };


                speechSynthesis.cancel();


                speechSynthesis.speak(
                    speech
                );

            } catch (fallbackError) {

                console.error(
                    "Browser voice error:",
                    fallbackError
                );
            }
        }
    }
}


// ============================================================
// BARGE-IN
// ============================================================

function startBargeListening() {

    if (
        !recognition
        ||
        !ttsSpeaking
        ||
        isListening
    ) {

        return;
    }


    recognitionMode =
        "barge";


    bargeStartTime =
        Date.now();


    try {

        recognition.lang =
            "en-IN";


        recognition.continuous =
            true;


        recognition.interimResults =
            true;


        recognition.start();

    } catch (e) {
    }
}


function stopBargeListening() {

    if (
        !recognition
    ) {

        return;
    }


    if (
        recognitionMode !==
        "barge"
    ) {

        return;
    }


    recognitionMode =
        "idle";


    try {

        recognition.stop();

    } catch (e) {
    }
}


// ============================================================
// SPEECH RECOGNITION
// ============================================================

function initializeRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (
        !SpeechRecognition
    ) {

        return;
    }


    if (
        recognition
    ) {

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.lang =
        "en-IN";


    recognition.onstart =
        function() {

            isListening =
                true;


            orb.classList.add(
                "listening"
            );
        };


    recognition.onresult =
        function(event) {

            let finalText =
                "";


            let interimText =
                "";


            for (
                let i =
                    event.resultIndex;

                i <
                event.results.length;

                i++
            ) {

                const transcript =
                    event.results[i][0]
                        .transcript
                        .trim();


                if (
                    event.results[i]
                        .isFinal
                ) {

                    finalText +=
                        (
                            finalText
                                ? " "
                                : ""
                        )
                        +
                        transcript;

                } else {

                    interimText +=
                        (
                            interimText
                                ? " "
                                : ""
                        )
                        +
                        transcript;
                }
            }


            finalText =
                finalText.trim();


            interimText =
                interimText.trim();


            /* =================================================
               USER INTERRUPTS JARVIS
            ================================================== */

            if (
                recognitionMode ===
                "barge"
            ) {

                const enoughTimePassed =
                    Date.now() -
                    bargeStartTime >
                    700;


                const heardText =
                    (
                        interimText ||
                        finalText
                    ).trim();


                if (
                    enoughTimePassed
                    &&
                    heardText.length >= 2
                ) {

                    /*
                        STOP JARVIS IMMEDIATELY.
                    */

                    interruptJarvis();


                    /*
                        Switch recognition from
                        interruption mode to normal
                        user-listening mode.
                    */

                    recognitionMode =
                        "manual";


                    userInput.value =
                        heardText;
                }


                if (
                    finalText
                ) {

                    recognitionMode =
                        "idle";


                    try {

                        recognition.stop();

                    } catch (e) {
                    }


                    userInput.value =
                        finalText;


                    setTimeout(
                        sendMessage,
                        80
                    );
                }


                return;
            }


            /* =================================================
               NORMAL MICROPHONE MODE
            ================================================== */

            if (
                recognitionMode ===
                "manual"
            ) {

                if (
                    interimText
                ) {

                    userInput.value =
                        interimText;
                }


                if (
                    finalText
                ) {

                    recognitionMode =
                        "idle";


                    try {

                        recognition.stop();

                    } catch (e) {
                    }


                    userInput.value =
                        finalText;


                    setTimeout(
                        sendMessage,
                        80
                    );
                }
            }
        };


    recognition.onend =
        function() {

            isListening =
                false;


            orb.classList.remove(
                "listening"
            );


            /*
                Keep listening for interruption
                while JARVIS is still speaking.
            */

            if (
                recognitionMode ===
                "barge"
                &&
                ttsSpeaking
            ) {

                setTimeout(
                    function() {

                        if (
                            recognitionMode ===
                                "barge"
                            &&
                            ttsSpeaking
                        ) {

                            startBargeListening();
                        }

                    },
                    150
                );
            }
        };


    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );


            isListening =
                false;


            orb.classList.remove(
                "listening"
            );


            if (
                recognitionMode ===
                "barge"
                &&
                ttsSpeaking
            ) {

                setTimeout(
                    function() {

                        startBargeListening();

                    },
                    200
                );
            }
        };
}


// ============================================================
// MANUAL MIC
// ============================================================

function startManualListening() {

    if (
        !recognition
    ) {

        initializeRecognition();


        if (
            !recognition
        ) {

            addMessage(
                "jarvis",
                "Voice input is not supported in this browser. Chrome ya Edge use karo."
            );


            return;
        }
    }


    /*
        If JARVIS is speaking, clicking mic
        also immediately stops JARVIS.
    */

    if (
        ttsSpeaking
    ) {

        stopTTS();
    }


    recognitionMode =
        "manual";


    try {

        recognition.lang =
            "en-IN";


        recognition.continuous =
            true;


        recognition.interimResults =
            true;


        recognition.start();

    } catch (e) {
    }
}


// ============================================================
// MUSIC DETECTION
// ============================================================

function isMusicCommand(
    text
) {

    const t =
        text
            .toLowerCase()
            .trim();


    const actions = [

        "play",
        "bajao",
        "baja do",
        "chalao",
        "chala do",
        "sunao",
        "suna do"
    ];


    const musicWords = [

        "song",
        "music",
        "gaana",
        "gana",
        "gaane",
        "track"
    ];


    const hasAction =
        actions.some(
            word =>
                t.includes(word)
        );


    const hasMusic =
        musicWords.some(
            word =>
                t.includes(word)
        );


    return (
        hasAction
        &&
        (
            hasMusic
            ||
            t.includes("youtube")
            ||
            t.startsWith("play ")
        )
    );
}


function extractMusicQuery(
    text
) {

    let query =
        text.toLowerCase();


    const patterns = [

        /\bplay\b/gi,
        /\bplease\b/gi,
        /\bopen\b/gi,
        /\bwatch\b/gi,

        /\blisten\s+to\b/gi,
        /\blisten\b/gi,

        /\bon\s+youtube\b/gi,
        /\byoutube\b/gi,
        /\byou\s+tube\b/gi,

        /\b(song|music|track)\b/gi,

        /\b(gaana|gana|gaane)\b/gi,

        /\b(bajao|baja do)\b/gi,

        /\b(chalao|chala do)\b/gi,

        /\b(sunao|suna do)\b/gi,

        /\b(par|pe)\b/gi
    ];


    for (
        const pattern of patterns
    ) {

        query =
            query.replace(
                pattern,
                " "
            );
    }


    return query
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        ||
        "music";
}


// ============================================================
// PLAY YOUTUBE
// ============================================================

async function playMusic(
    originalText
) {

    stopTTS();


    const query =
        extractMusicQuery(
            originalText
        );


    musicWindow =
        window.open(
            "about:blank",
            "_blank"
        );


    addThinking();


    try {

        const response =
            await fetch(
                "/youtube",
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify({
                            query:
                                query
                        })
                }
            );


        const data =
            await response.json();


        removeThinking();


        if (
            !response.ok
            ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "YouTube search failed."
            );
        }


        if (
            data.video_id
        ) {

            youtubeArea.style.display =
                "block";


            youtubePlayer.src =
                "https://www.youtube.com/embed/"
                +
                encodeURIComponent(
                    data.video_id
                )
                +
                "?autoplay=1&playsinline=1&rel=0";


            if (
                musicWindow
                &&
                !musicWindow.closed
            ) {

                musicWindow.location.href =
                    data.url;

            } else {

                window.open(
                    data.url,
                    "_blank"
                );
            }


            addMessage(
                "jarvis",

                selectedLanguage ===
                "hinglish"

                    ?

                `Theek hai, ${data.title} YouTube par play kar raha hoon.`

                    :

                `Okay, playing ${data.title} on YouTube.`
            );


        } else {

            const searchUrl =
                data.url;


            if (
                musicWindow
                &&
                !musicWindow.closed
            ) {

                musicWindow.location.href =
                    searchUrl;

            } else {

                window.open(
                    searchUrl,
                    "_blank"
                );
            }


            const message =
                selectedLanguage ===
                "hinglish"

                    ?

                `YouTube par ${query} search kar raha hoon.`

                    :

                `Searching YouTube for ${query}.`;


            addMessage(
                "jarvis",
                message
            );


            speakText(
                message
            );
        }


    } catch (error) {

        removeThinking();


        const message =
            selectedLanguage ===
            "hinglish"

                ?

            "YouTube par song play nahi ho paaya."

                :

            "I could not play that song on YouTube.";


        addMessage(
            "jarvis",
            message
        );
    }
}


// ============================================================
// SEND MESSAGE
// ============================================================

async function sendMessage() {

    const prompt =
        userInput.value.trim();


    if (
        !prompt
    ) {

        return;
    }


    userInput.value =
        "";


    addMessage(
        "user",
        prompt
    );


    /*
        MUSIC
    */

    if (
        isMusicCommand(
            prompt
        )
    ) {

        await playMusic(
            prompt
        );


        return;
    }


    /*
        STOP OLD VOICE
    */

    stopTTS();


    /*
        TIME
    */

    if (
        isTimeQuestion(
            prompt
        )
    ) {

        const answer =
            getTimeAnswer();


        addMessage(
            "jarvis",
            answer
        );


        speakText(
            answer
        );


        return;
    }


    /*
        DATE
    */

    if (
        isDateQuestion(
            prompt
        )
    ) {

        const answer =
            getDateAnswer();


        addMessage(
            "jarvis",
            answer
        );


        speakText(
            answer
        );


        return;
    }


    /*
        AI
    */

    addThinking();


    try {

        const response =
            await fetch(
                "/ask-ai",
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify({

                            prompt:
                                prompt,

                            language:
                                selectedLanguage
                        })
                }
            );


        const data =
            await response.json();


        removeThinking();


        if (
            !response.ok
            ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Server error."
            );
        }


        addMessage(
            "jarvis",
            data.answer
        );


        /*
            FULL ANSWER -> ONE TTS REQUEST
        */

        speakText(
            data.answer
        );


    } catch (error) {

        console.error(
            "AI ERROR:",
            error
        );


        removeThinking();


        const message =
            selectedLanguage ===
            "hinglish"

                ?

            "Sorry yaar, abhi server ya connection mein problem aa rahi hai."

                :

            "Sorry, there is a server or connection problem.";


        addMessage(
            "jarvis",
            message
        );


        speakText(
            message
        );
    }
}


// ============================================================
// ENTER KEY
// ============================================================

function handleKey(
    event
) {

    if (
        event.key ===
        "Enter"
    ) {

        event.preventDefault();


        sendMessage();
    }
}
